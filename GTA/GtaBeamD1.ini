; GtaBeamD1 settings (GTA x Beam kit v2.7: D1 + D3 + T2 drive mode with your BeamNG controls, gauge and sound,
; T3 = GTA's ground in BeamNG; v2.2-v2.4 settings at the end of this file).
; Every line is optional: delete one to use its default.
; Tip: change a value, save, then press Ctrl+F11 in game to apply it (texture sizes, TextureCompression,
; NormalMaps/SurfaceMaps, LayerMaskCheck and MeshAxes/MeshOrientation apply on the next load: Shift+F11).
[D1]

; ---------------------------------------------------------------- the car file
; Leave empty: the plugin uses the path BeamNG reports after Shift+F11, and at start it loads
; %LOCALAPPDATA%\BeamNG\BeamNG.drive\current\gtabridge\car.gltf (the last export) if it exists.
CarFile=
; Load the last exported car when GTA starts (1) or wait for Shift+F11 (0)
LoadAtStart=1
; v1.9.3: BeamNG's .dds textures are used as they are (compressed on the GPU: 4-8x less video memory than
; v1.9.1's converted PNGs). 1 = on. 0 = decode them like PNGs (more memory; only if something looks wrong).
TextureCompression=1
; Colour textures bigger than this use their next smaller built-in size (pixels). 2048 compressed costs about
; what 1024 did in v1.9.1. 4096 = full BeamNG quality on most cars (4x the memory of 2048), 1024 = least memory.
MaxTextureSize=2048
; Same for normal / metallic / roughness / opacity maps
MaxDataTextureSize=1024
; Seconds to wait for BeamNG's export
ExportTimeout=300
BeamNGPort=47011

; ---------------------------------------------------------------- placement on the GTA car
; Metres, in the GTA car's frame. The BeamNG car's footprint centre sits on the GTA model's
; footprint centre, with the tyre bottoms at the GTA model's lowest point.
OffsetRight=0.0
OffsetForward=0.0
OffsetUp=0.0
; Turn the drawn car about its up axis (180 if it faces backwards)
TurnDegrees=0
; How the file's axes are read: auto, gltf, beamng. Only change if the car lies on its side.
MeshAxes=auto
; Which way is the car's front: auto, direction (as exported), vehicle (BeamNG -y forward)
MeshOrientation=auto

; How the GTA car is hidden:
;   auto        = ghost, or transparent with ShadowMode=gta
;   ghost       = v1.9.3: fully transparent and its shadow switched off; GTA keeps turning its wheels (needed
;                 for WheelSource=auto/gta) and the driver stays in it
;   transparent = fully transparent, GTA keeps drawing its shadow
;   invisible   = hidden completely (v1.9.1): no shadow, but GTA stops turning its wheels
; v2.0: drive mode (F10) always hides it completely: no grey halo from GTA's shadow of it
HideMode=auto
; v1.9.3: 1 = you stay visible in the driver's seat, 0 = hidden while you sit in the car. v2.71: in drive mode too (hiding
; GTA's car hid you with it)
ShowDriver=1
; v2.71: drive mode: GTA's hidden car is placed so your head is at the BeamNG car's driver camera (each car's own seat).
; DriverSeatRightM / DriverSeatForwardM / DriverSeatUpM move you from there (m). 0 = GTA's car on the drawn car's footprint (v2.7)
DriverSeat=1
DriverSeatRightM=0
DriverSeatForwardM=0
DriverSeatUpM=0
; v2.73: the drawn car's front doors open with GTA's (getting in or out): this many degrees when GTA's is fully open.
; Parts named "door" in the car file (not rear doors) turn about their front edge. 0 = never open.
DoorOpenDeg=65

; ---------------------------------------------------------------- shadows
; own = our shadow of the BeamNG car itself (right shape; the sun direction is our estimate) - default
; gta = GTA's own shadow of the hidden GTA car (right sun and softness, GTA car's shape)
; off = none
ShadowMode=own
; darkness right under the car (both modes), 0..1
ContactShadow=0.6
; darkness of our sun shadow on the ground (ShadowMode=own), 0..1 (v1.9.5: 0.55 -> 0.7, GTA's shadows are darker)
SunShadowStrength=0.7
; blur of our shadows: 0 = sharp, 1 = normal, 2 = very soft
ShadowSoftness=1.0
; Our sun estimate (GTA has no way to ask for its sun direction). If our shadow points a different
; way than GTA's shadows, turn it here in degrees (e.g. 20 or -20) and press Ctrl+F11.
SunAzimuthOffset=0
; >1 = higher sun (shorter shadows), <1 = lower sun (longer shadows)
SunElevationScale=1.0
; v1.9.1: the car shades itself from the sun (roof over the cabin, body over the wheels). 1 on, 0 off.
SelfShadows=1
; size of that shadow map (pixels): 1024 = sharp enough, 2048 = sharper (+12 MB video memory)
SelfShadowSize=1024
; v1.9.1: soft darkening in corners and gaps (wheel arches, under the bumpers, cabin), baked once per car
AmbientOcclusion=1
AOStrength=1.0
; v1.9.1: the car goes dark when GTA's buildings/trees block the sun (5 rays every few frames)
WorldShadows=1

; ---------------------------------------------------------------- wheels
; 1 = wheels spin and steer
Wheels=1
; v1.9.1 where the spin/steer/suspension comes from:
;   auto = GTA's own wheels (read from the GTA car's wheel bones; learned in the first metres of driving),
;          the speed model below if that doesn't work
;   gta  = GTA's wheels only, speed = the v1.9 speed model only
WheelSource=auto
; 1 = the wheels move up and down with GTA's suspension
SuspensionTravel=1
; speed model only (WheelSource=speed or fallback):
MaxSteerDegrees=32
; -1 if the front wheels steer the wrong way
SteerSign=1
; Which wheels spin in a burnout: auto (from the BeamNG export, else rear), rear, front, all
DrivenWheels=auto
; Tyre speed in a GTA burnout, metres per second (22 = about 50 mph)
BurnoutWheelSpeed=22
; 1 = the handbrake stops the rear wheels
HandbrakeLocksRear=1

; ---------------------------------------------------------------- where the car is drawn (v1.9.3/v1.9.4, test D3)
; v1.9.4: GTA swaps between look-alike HDR textures from frame to frame; the place is now recognised by
; what the textures look like (format, size, order), so it should lock on within a second.
; auto    = INSIDE GTA's frame, into its HDR picture right before GTA's post-processing: GTA's exposure,
;           tone mapping, bloom and anti-aliasing apply to the car, and the HUD/minimap is drawn over it.
;           The plugin finds that place by itself in the first second (log: "D3: drawing the car INSIDE
;           GTA's frame"); until then, or if it can't, the car is drawn at Present like v1.9.1.
; present = always at Present (v1.9.1)
DrawStage=auto
; Which of GTA's HDR pictures the car goes into: auto (the one GTA's post-processing reads, else the last
; one GTA drew with its depth buffer), 1 = always the last one, 2 = the one before it. Only change this if
; the car is missing with DrawStage=auto (and send the log).
HdrTarget=auto
; Inside GTA's frame the brightness comes from GTA's own HDR picture. Sunlight = this many times the
; sky's brightness. v1.9.6: auto = measured from GTA's own light levels (log line "light (GTA's G-buffer ...)
; ... using X (auto)"), only in daylight with the sun not blocked. A number = fixed (v1.9.5 used 6).
HdrSunToSky=auto
; Light from the surroundings inside GTA's frame (Ambient below is for DrawStage=present).
; v1.9.6: auto = measured the same way. A number = fixed (v1.9.5 used 1.0).
HdrAmbient=auto

; ---------------------------------------------------------------- camera (v1.9.4: the "skip" at speed)
; Which of GTA's camera readings the car is drawn with: auto (the one that stays in step with the car;
; log: "camera: timing slips ..."), final (GTA's final rendered camera, as before), gameplay
CameraSource=auto
; 1 = when a camera reading is a game step out of step with the car (the car would jump for one frame),
; put it back in step. 0 = off (only counted in the log). v2.2: normal driving only; drive mode has
; DriveCameraSlipFix (end of this file).
CameraSlipFix=1
; v1.9.5: 1 = each drawn frame uses the car/camera reading at a fixed offset from its frame number, so
; the car advances exactly one game step per frame (no "repeated" / "skipped" in the timing log).
; 0 = always the newest reading (v1.9.4)
FramePairing=1

; ---------------------------------------------------------------- look
; Overall brightness
Brightness=1.0
; Light from the sky/surroundings when drawn at Present (inside GTA's frame: HdrAmbient)
Ambient=0.35
; Sun glints on paint/chrome, and the sun's direct light
SpecularStrength=1.0
SunStrength=1.0
; Reflections on paint/glass/chrome
Reflections=1.0
; What reflections show: world = learned from GTA's own picture as you look around (default)
; sky = a made-up sky gradient (v1.8 look)
Environment=world
EnvBrightness=1.0
; Reflections on see-through parts (windows). Lower it (e.g. 0.3) if a window still looks milky.
GlassReflections=1.0
; Normal maps (surface bumps: grilles, seats, tyres). NormalMapStyle: opengl (BeamNG) or directx
NormalMaps=1
NormalStrength=1.0
NormalMapStyle=opengl
; Metallic / roughness maps
SurfaceMaps=1
; v1.9.1: a detail layer whose mask hides it on every triangle of its material is drawn without the mask
; (fixes the grey RRpbr trims; the log says which). 0 = use every mask as it is.
LayerMaskCheck=1
; 2.2 = BeamNG paint values are sRGB-like (default). 1.0 = use them as they are.
PaintGamma=2.2
; Glass: lowest opacity (0..1). 0 = as BeamNG has it
GlassMinAlpha=0
; Cut out see-through texture parts on solid materials (0 = off, try 0.3 if grilles/decals show black boxes)
AlphaCutout=0.0
; v1.9.1: smooth the car's outline (less jagged edges)
EdgeSmoothing=1

; ---------------------------------------------------------------- GTA's HUD
; v1.9.1: keep the minimap on top of the car when drawn at Present (inside GTA's frame it is on top anyway).
; MinimapMargin = extra pixels around it.
KeepMinimapOnTop=1
MinimapMargin=6

; ---------------------------------------------------------------- debug views (Ctrl+F11 after changing)
; 0 normal, 1 colour only (no light), 2 how much layers 2/3/4 show (red/green/blue),
; 3 surface normals, 4 metal (red) / roughness (green) / clear coat (blue), 5 see-through parts (orange = opacity),
; 6 one colour per material, 7 light check (red = sunlit, green = open to the sky, blue = reflections not blocked;
; dark = shadowed by the car itself or a corner), v1.9.4: 8 reflections only, 9 the surroundings as the
; paint's mirror sees them, 10 diffuse light only, v1.9.7: 11 GTA's reflection map as the paint's mirror sees
; it (magenta = not in use yet)
DebugView=0

; ---------------------------------------------------------------- v1.9.5
; See-through parts BeamNG draws from one side only (window tint has an outer and an inner surface):
; 1 = the same here (otherwise a limo tint is passed twice from inside: black windows), 0 = both sides
OneSidedGlass=1
; 1 = measure how far GTA's ground is under the drawn tyres (log line "ride height"); nothing is moved yet
RideHeightCheck=1

; ---------------------------------------------------------------- v1.9.6
; The stutter at speed: GTA's camera reading is one game frame behind its car, so the car was drawn one
; game step ahead of the camera GTA drew the world with (a jump every frame, bigger at speed).
;   auto     = measure both and use the steadier one (log line "car/camera pairing: ..."); starts with previous
;   previous = the car of the tick before with this tick's camera (the fix)
;   same     = car and camera from the same tick (v1.9.5)
CarCameraPairing=auto
; The paint's surface. BeamNG multiplies each paint's metallic / roughness / clear coat into the paint
; layers (whose own values are all 1); v1.9.5 didn't, so paint looked like rough bare metal ("alloy").
; auto = the paint's own values from the BeamNG export (needs the BeamNG mod 1.9.6 and a new Shift+F11
; export; log line "paint surface from BeamNG ..."), else 0.3 / 0.45 / 1.0 / 0.05.
; A number 0..1 overrides it for every paint slot (Ctrl+F11 applies it at once - handy for comparing).
PaintMetallic=auto
PaintRoughness=auto
PaintClearCoat=auto
PaintClearCoatRoughness=auto

; ---------------------------------------------------------------- v1.9.7: GTA's own reflections
; GTA draws its surroundings into a reflection map every frame (that's what its own cars reflect). Inside
; GTA's frame the car now reflects that map: sharp buildings and sky in the clear coat, like GTA's cars.
;   auto = on once the plugin has worked out how the map is laid out (it compares the map with GTA's
;          picture for a few seconds; log lines "GTA reflections: ..."); until then the learned surroundings
;   0    = off (the v1.9.6 look)
; Needs GTA's graphics setting "Reflection Quality" on.
GtaReflections=auto
; Brightness of those reflections. v2.0: 1.0 = GTA's map as it is (default). v1.9.7's auto matched it to
; GTA's picture but swung between x0.6 and x2.6 (too shiny); "auto" still does that. Lower = less mirror-like.
GtaReflectionScale=1.0
; The map's layout, 0..31 for the directions above and below the horizon. auto = worked out by itself.
; v2.0: your v1.9.7 log found 8 (above) and 2 (below), so they're set here (no learning time).
; Put auto back if reflections ever look upside down or mirrored.
GtaReflectionLayoutUp=8
GtaReflectionLayoutDown=2

; ---------------------------------------------------------------- depth (from D0, leave as is)
FrameDelay=0
FovIsHorizontal=0
RollSign=1
DepthTolerance=0.002
DepthToleranceMeters=0.05
DepthSource=auto
DepthReversed=auto
NearScale=1.0

; The plugin's key (Windows virtual key code). 0x7A = F11
Key=0x7A

; ---------------------------------------------------------------- v2.0: drive mode (T2)
; DriveKey (default F10 = 0x79): BeamNG's physics drive the car and the plugin draws it in GTA. Sit in the
; driver's seat of a GTA car with the BeamNG car on it, press F10. F10 again (or F11, or leaving the car)
; stops it. v2.01: Shift+F10 turns the on-screen drive check text on/off.
DriveKey=0x79
; Which way BeamNG steers (only used when GTA's controls steer: DriveInput=gta or no BeamNG steering
; binding): auto = learned in the first seconds of turning (log line "drive: steering ..."). 1 or -1 = fixed.
DriveSteerSign=auto
; How BeamNG smooths the controls: auto (keyboard -> BeamNG's keyboard filter, pad -> its pad filter),
; key, pad, direct (no smoothing)
DriveInputFilter=auto
; How far behind BeamNG the car is drawn, to smooth between BeamNG's frames: auto (about one BeamNG frame plus
; delivery jitter; log line "drawn N ms behind") or milliseconds
DriveSmoothingMs=auto
; 1 = the hidden GTA car moves with BeamNG's speed between updates (GTA's camera sees the speed),
; 0 = it is frozen and only placed (try this if GTA's camera behaves oddly). v2.2: stutter test B.
DriveSetVelocity=1

; ---------------------------------------------------------------- v2.01: your BeamNG controls in drive mode
; beamng = the plugin reads your pad (XInput) and keyboard itself and the BeamNG mod runs them through YOUR
;          BeamNG bindings (Options > Controls in BeamNG): manual gears, clutch, drive modes, ESC... all as in
;          BeamNG. v2.4: in BeamNG mode a pad button BeamNG has nothing on does nothing; keys BeamNG has nothing on stay GTA's.
;          (Default.)
; gta    = v2.0: GTA's own driving controls (throttle/brake/steer/handbrake only).
DriveInput=beamng
; The pad button that switches the whole pad between GTA and BeamNG. v2.4: in GTA mode every button does what GTA does
; with it (D-pad left hold = radio wheel...); in BeamNG mode every button is BeamNG's, with your BeamNG bindings and
; modifier combinations (a button BeamNG has nothing on does nothing). Names: A B X Y LB RB LT RT BACK START LS RS
; DPAD_UP DPAD_DOWN DPAD_LEFT DPAD_RIGHT (PlayStation names work too: CROSS CIRCLE SQUARE TRIANGLE L1 R1 L2 R2 L3 R3
; SHARE OPTIONS). none = no toggle. Whatever you hold while switching is ignored until you let go.
PadToggle=DPAD_DOWN
; Pad controls that always stay GTA's (GTA mode or not). v2.4 default: Y (get out = drive ends) and the right stick
; (camera). START follows the mode: in BeamNG mode it goes to BeamNG (switch to GTA mode first to pause GTA).
PadAlwaysGta=Y, RSTICK
; Pad controls that always go to BeamNG (if BeamNG has a binding for them): steering stick and both triggers,
; so you can keep driving while aiming/shooting in GTA mode.
PadAlwaysBeamNG=LSTICK, LT, RT
; 1 = drive mode starts with the pad in GTA mode (D-pad down switches to BeamNG)
PadStartsInGtaMode=0
; Which XInput pad: auto (the one you touched last) or 0..3
PadIndex=auto
; Keys that always stay GTA's (BeamNG names). The mouse always stays GTA's (aim/shoot on foot and in GTA mode).
KeysAlwaysGta=f, escape, p, tab
; Which of your BeamNG bindings are used, by BeamNG's action category (vehicle = driving, gears, lights,
; drive modes...). v2.2: a category matches when it IS one of these or starts with it + "_" (vehicle_specific);
; debug categories (vehicle_debug: reload car, debug views) never match.
BeamNGActionCategories=vehicle
; Actions never run from GTA (resets/recovery would teleport BeamNG's car away from the GTA world).
; v2.2: reload_vehicle / reload_all_vehicles added (the BeamNG mod blocks them anyway).
BeamNGActionsNever=reset_physics, reset_all_physics, recover_vehicle, recover_vehicle_alt, recover_to_last_road, loadHome, saveHome, dropPlayerAtCamera, dropPlayerAtCameraNoReset, toggleWalkingMode, switch_next_vehicle, switch_previous_vehicle, vehicle_selector, parts_selector, reload_vehicle, reload_all_vehicles
; Extra actions to run even if their category isn't listed above (names from gtabridge/bindings.txt)
BeamNGActionsAlso=
; v2.43: these actions (your repair binding, e.g. RB+LB+X) repair BeamNG's car where it is: upright, facing the same way,
; 0.5 m up (BeamNG's own reset / recover / home would move it away from the GTA world). Empty = they stay blocked.
; v2.51: reload_vehicle / reload_all_vehicles too (a repair binding is often BeamNG's "reload vehicle").
BeamNGRepairActions=reset_physics, reset_all_physics, recover_vehicle, recover_vehicle_alt, recover_to_last_road, loadHome, reload_vehicle, reload_all_vehicles
; v2.43: 1 = pausing one game pauses the other. GTA paused or alt-tabbed: BeamNG's physics pause. You pause BeamNG: GTA's pause
; menu opens, and closes when BeamNG runs again. 0 = v2.42 (GTA paused: BeamNG's car brakes, BeamNG keeps running).
PauseSync=1
; 1 = small check text at the bottom of the screen, right of the minimap, while driving: pad mode, what is sent, what the BeamNG car
; does (gear, throttle, rpm, speed) and the last BeamNG actions run. Shift+F10 turns it on/off in game. v2.1: off by default (the
; gauge shows the car); turn it on when something doesn't respond.
DriveCheckText=0
; 1 = while the BeamNG car is parked in GTA (drawn, not driving) and GTA has the focus, BeamNG's own
; controls are switched off, so pad presses meant for GTA don't also drive BeamNG's car in the background.
ParkBlocksBeamNG=1

; ---------------------------------------------------------------- v2.1
; Which of your BeamNG pad lists drives: auto = your PlayStation list when BeamNG has one with driving bindings (a PlayStation
; pad you hold through DS4Windows: your own buttons, not DS4Windows' Xbox defaults), else the Xbox (XInput) list.
; xinput / playstation = always that one. The BeamNG log line "drive:   device ..." says which one is used.
BeamNGPadBindings=auto
; The BeamNG gauge at the bottom right while driving: speed, gear, rev bar (white, orange, red = shift) and the pad mode.
DriveGauge=1
; mph or kmh
DriveGaugeUnits=mph
; 1 = BeamNG keeps playing its own car sound while GTA has the focus. v2.2: the BeamNG mod switches BeamNG's real option
; (Options > Audio, "mute when the window loses focus" = AudioMuteOnWindowLoseFocus) off while you drive and puts back
; whatever it was afterwards (if you turned it off yourself, it stays off).
BeamNGSound=1
; 0 = the hidden GTA car's engine is off while you drive (so you only hear BeamNG's), 1 = GTA's engine sound too.
; v2.3: with the engine off GTA's car radio is silent (your v2.2 test); DriveRadio (below) plays it as the phone radio.
DriveGtaEngineSound=0

; ---------------------------------------------------------------- v2.2: the drive-mode stutter (tests A-C)
; Change one, save, Ctrl+F11 in game, drive the same stretch again. The BeamNG log and GtaBeamD1.log say what is in use.
; A) 1 = the camera slip fix (CameraSlipFix) also runs in drive mode. v2.4 default 1: your v2.3 run B ("feels almost perfect").
;    0 = off in drive mode.
DriveCameraSlipFix=1
; C) readback = draw the car where GTA reports its hidden car (v2.1). set = draw it where the plugin put it, moved on by its
;    speed for GTA's step (GTA's physics can't nudge what is drawn). Log line "drive: GTA moved its car after we placed it"
;    says how much GTA moves it.
DriveDrawPose=readback
; D) BeamNG's frame limit while its window is in the background, during drive mode only (BeamNG's own setting, put back
;    after): keep = leave it as it is (the BeamNG log shows the value at each drive start), off = no limit, or a number (60, 120).
;    v2.3 default: off (your best v2.2 run; your BeamNG limit is 90). If GTA's frame rate drops while driving, try 120.
BeamNGBackgroundFps=off

; ---------------------------------------------------------------- v2.3
; How the hidden GTA car follows BeamNG's car (GTA's camera follows that hidden car):
;   filter = BeamNG's speed carries it from frame to frame and BeamNG's position pulls it back gently. BeamNG's positions
;            wobble by a few cm against their timestamps (its physics runs on its own clock), and v2.2 put the car exactly
;            on them: GTA's camera saw that wobble as jitter. (Default.) Log line "drive: smoothness: ..." measures it.
;   direct = v2.2 (the car put exactly on BeamNG's interpolated position every frame)
DriveMotion=filter
; v2.42: which BeamNG clock times its car positions. sim = its physics clock (the fix for the rubber band at speed: your v2.41
; log had positions 6-10 cm off its frame clock, up to 64 cm at 80 mph, and 0.1 cm off its physics clock); frame = v2.41.
DrivePoseClock=sim
; v2.42: 1 = BeamNG's car positions and the drawn car go to GtaBeamD1_poses.csv (for the rubber band; send it if it's back)
DrivePoseLog=1
; How fast the filter pulls the car onto BeamNG's position (ms). Lower = tighter but more of the wobble, higher = smoother.
DriveFilterMs=80
; BeamNG only notices its "mute when unfocused" option when its window loses the focus.
;   bounce  = when the BeamNG mod has just switched the option off (it was on), BeamNG's window comes to the front for a
;             moment and GTA comes back, at drive start and end (a short flash; default). Skipped in exclusive fullscreen.
;             v2.4: every step is in GtaBeamD1.log ("sound: wake ...").
;   session = v2.4: no flash. The BeamNG mod switches the option off for the whole BeamNG session (at BeamNG's start, while
;             it still has the focus: start BeamNG first) and turns BeamNG's volume down while GTA isn't driving
;             (BeamNGQuietVolume). It remembers this for the next BeamNG start; the first time it needs one flash or one
;             alt-tab to BeamNG and back. Back to bounce/off switches it off again.
;   off     = nothing (turn BeamNG's option off yourself)
;   (v2.3's "message" is gone: it failed 8 of 8 in your test)
BeamNGSoundWake=bounce
; How long BeamNG's window stays in front (ms)
BeamNGSoundWakeMs=120
; session mode: BeamNG's volume while GTA isn't driving, as a part of its own volume (0 = silent, 1 = unchanged)
BeamNGQuietVolume=0
; GTA's radio while you drive: phone = played as the phone radio (the hidden GTA car's engine is off). v2.4: it stays off
; if it was off at F10, and GTA's own radio controls work in GTA mode (D-pad left: tap = next station, hold = radio
; wheel; keyboard Q/comma/period stay your BeamNG keys). engine = GTA's engine stays on (its own radio, but GTA's engine
; sound too). off = no GTA radio.
DriveRadio=phone
; Pad buttons that run one of YOUR BeamNG actions while the button is GTA's (GTA mode). "button: action, button: action".
; Action names: gtabridge/bindings.txt. GTA's own use of that button is switched off. v2.4: none by default (in BeamNG mode
; every button is BeamNG's anyway). Example: DPAD_RIGHT: toggle_headlights
PadGtaActions=

; ---------------------------------------------------------------- v2.4: GTA's ground in BeamNG (T3)
; 1 = F10 builds GTA's ground in BeamNG and puts BeamNG's car on it: BeamNG's physics drive on GTA's real streets and hills,
;     with the grip of GTA's ground (asphalt, dirt, grass, sand... see GtaBeamD1_surfaces.json). 0 = v2.3 (BeamNG's own map).
; GTA's ground is built WorldZLift metres above BeamNG's own map; use an empty BeamNG level ("Grid, Small, Pure").
World=1
; F10 on only below this speed (km/h): BeamNG's car starts from rest for now. F10 off works at any speed.
DriveStartMaxKmh=5
; 1 = F10 off hands BeamNG's speed to GTA's car (GTA's physics carry on); 0 = it stops dead (v2.3)
DriveExitKeepSpeed=1
; Tiles: size (m) and finest point spacing (m). Curbs become ramps one spacing wide.
WorldTileM=8
WorldStepM=0.5
; v2.42: each tile is measured coarse to fine: every WorldCoarseM metres first (plus each cell's middle); a cell that isn't
; flat (BeamNG's 2 triangles over it more than WorldRefineCm off a point: curbs, dips), has a point without ground or (2 m
; cells) two surfaces gets the points twice as close; again until 0.5 m. Soft ground (grass, dirt, sand, gravel, mud,
; snow) uses WorldRefineSoftCm. Flat cells go to BeamNG as one cell (2 triangles). WorldCoarseM=0 = every point (v2.4).
WorldCoarseM=2
; v2.52: 2 (was 4): roads drawn closer to GTA's shape (smoother at speed; a few more rays). Lower = smoother still.
; v2.56: 1.5 (your 2.55 test: still a little bumpy at speed). It only matters where the road isn't flat: a cell that is flat
; within this keeps its 2 triangles, so a truly flat road doesn't change; a gently curved one gets finer points (smoother).
; v2.62: it changes the road's shape by a centimetre or two at most, so it is hard to feel; it doesn't change the car's weight
; (that's DriveGravity).
WorldRefineCm=1.5
WorldRefineSoftCm=8
; How much ground: all around the car (m), ahead: speed x seconds, this wide (m)
WorldRadiusM=24
WorldAheadS=2.5
WorldWidthM=32
; Rays GTA measures with: new ones per script tick, and most waiting for GTA at once (lowered by itself when GTA refuses
; one: the log line "ground: ... refused by GTA (limit now N)" shows it). Fewer = less work for GTA, less road ahead.
WorldRaysPerFrame=96
WorldRaysInFlight=384
; v2.41: your v2.4 log: GTA took only ~10 of these rays a frame. Extra immediate rays, at most WorldSyncMs of GTA's frame each
; tick (0 = off); v2.43: for all ground the car needs (v2.42: only within WorldUrgentS seconds), the ring when standing. The
; log shows what they cost (your v2.42 log: 10 us each).
WorldSyncMs=1.0
WorldUrgentS=1.5
; tiles measured at the same time
WorldTilesAtOnce=16
; v2.41: measured tiles remembered (driving back = no rays; ~2.5 KB each)
WorldCacheTiles=6000
; v2.42: at speed, road the car reaches within WorldDraftS seconds goes to BeamNG as a 2 m draft as soon as its first pass is
; done (the car never runs out of ground), and is replaced by the finished tile (not while the car is on it). 0 = no drafts.
WorldDraftS=2.0
; v2.42: the saved map (your idea): finished tiles are saved in GtaBeamD1_map\ next to this file and never measured again
; (regions of 128 m, read WorldMapReadM ahead). Delete that folder to measure everything again. 0 = off.
WorldMap=1
WorldMapReadM=256
; v2.42: with rays to spare (standing, slow), the ring around the car this far out (m) is measured ahead of need and saved.
; 0 = off.
WorldPrebuildM=96
; GTA's ground this far above BeamNG's own map (m), and a new origin at F10 when the car is this far from the old one (m)
WorldZLift=200
WorldRebaseM=2000
; BeamNG's car this far under GTA's ground (m) = it fell through a gap: it is put back on the last good spot (v2.41: when
; GTA's ground is built there; 3 falls in 30 s end drive mode instead of looping). v2.62: only after it stays under it for
; WorldFallWaitS seconds (or is 40 m under), so a crash plays out first. Never while it is over GTA's ground (a jump).
WorldFallCheckM=3
WorldFallWaitS=2.5
; v2.43: levels (bridges). The ground is measured for the level the car is on, carried tile by tile along its way (up a ramp
; onto a bridge; along the road under one). Ground more than WorldLevelM (m) above or below is another level: the saved map
; keeps up to 3 levels of the same spot. A step down of more than WorldDropM (m) within 1 m (a deck's edge) leaves the
; ground below it out instead of drawing a wall down to it (0 = off).
WorldLevelM=3.5
WorldDropM=2.5
; v2.43: a static world: built ground stays in BeamNG up to WorldKeepTris triangles (fewer at speed: every new tile makes
; BeamNG rebuild the collision of all of them, ~0.2 ms per 1000 triangles) and within WorldKeepM (m); the farthest go
; first. 0 = v2.42 (tiles behind you are taken out). Standing still, measured ground nearby goes to BeamNG at
; WorldFillPerS tiles a second.
WorldKeepTris=30000
WorldKeepM=400
WorldFillPerS=4
; v2.43: 1 = every tile's level decision in GtaBeamD1.log (big; only when asked). v2.61: and the tiles near the car as BeamNG
; gets them (heights, walls) in GtaBeamD1_tiles_dbg.txt
WorldDebug=0
; v2.5: where the ground is looked for around the car's level: WorldUpM (m) above it, WorldDownM (m) below it. Nothing
; else is taken (v2.43 also looked 20 m up / 50 m down when nothing was found: it hit the bridge above you or the road far
; below the deck, which made the walls under bridges and the falls at speed).
WorldUpM=4
WorldDownM=12
; v2.71: 1 = a point with no ground in that window is looked for again, 28 m further down, then 22 m further up. Ground
; found above is kept only if it meets the ground next to it (a hillside), not a roof or an overpass. 0 = off (v2.7).
WorldDeep=1
; v2.73: 1 = a hole in the ground with ground on two sides of it (along a road, across it) is filled in between, as asphalt
; (not over water, not steeper than 60%). Filled tiles aren't saved to the map file. 0 = off (holes stay empty, v2.72).
WorldFill=1
; v2.5: walls and barriers (jersey barriers, highway walls, building sides) are found with sideways rays at WorldWallProbeM
; (m) over the ground, on lines WorldWallStepM (m) apart, and go to BeamNG as solid boxes (not humps in the ground). Up to
; WorldWallMs (ms) a frame of GTA's time for it. 0 = off (v2.43: walls are ramps in the ground).
WorldWalls=1
WorldWallProbeM=0.6
WorldWallStepM=1.0
WorldWallMs=1.0
; v2.5: GTA's props within PropRangeM (m) of the car. v2.51: three kinds (GtaBeamD1_props.json, next to this ini, says which):
;   breakaway = posts, poles, signs, traffic lights, fences: a box in BeamNG your car really hits (only the post at bumper
;               height: GTA measures it, no arms over the road). It breaks when the car has lost its "break" speed against it
;               (PropBreak scales it: 2 = twice as hard), then GTA knocks it over (PropPush: how hard).
;   solid     = big or unbreakable ones (containers, bollards): a box that stays (PropSolid=0: left out).
;   soft      = small things (bins, cones, boxes): GTA knocks them over, BeamNG's car loses a little speed (PropBump).
; Every model met is in GtaBeamD1_props_seen.txt with what it was taken for. Props=0 = off.
Props=1
PropRangeM=40
PropPush=1.0
PropBump=1.0
PropSolid=1
PropBreak=1.0
; v2.52: physics props: the nearest posts, signs, bins and boxes become weighted boxes BeamNG simulates (the BeamNG mod's
; "vehicles\gtab_prop"), and GTA's prop copies its box: it tips over, flies or slides where BeamNG's goes.
;   posts / signs / lights / hydrants are tied to the ground: they snap when the car hits hard enough (PropBreak scales it),
;   then fall. Bins, cones, boxes are loose and light. The weight: by size, or "mass" (kg) in GtaBeamD1_props.json.
; PropPhysicsMax at once (each one may hitch BeamNG for a moment when it comes: the BeamNG log says how long). If BeamNG
; can't spawn them, the fixed boxes above are used. PropPhysics=0 = off (the v2.51 way).
; v2.53: off while the dents are worked on (in your 2.52 test they spawned inside the car and didn't follow GTA's props:
; fixed in v2.54). 1 = on.
PropPhysics=0
PropPhysicsMax=10
; v2.5: dents. The drawn car bends the way BeamNG's car does (its nodes, DentsPerSecond checks a second). v2.53: export the car
; again with the 2.53 BeamNG mod (Shift+F11): every part then sits on its own BeamNG part's nodes, like BeamNG's flexbodies
; (a bumper that falls off in BeamNG lies on the road in GTA too). 0 = off.
Dents=1
DentsPerSecond=20
; v2.5: BeamNG's gravity times this while GTA drives; put back when the drive ends. 1.0 = BeamNG's own. More = the car presses
; harder on its springs and tyres: it feels heavier, floats less over crests. v2.62: 1.1 again (your choice). v2.51 had gone back
; to 1.0 because 1.1 popped tyres at speed: the extra load on a sharp step in the ground. If tyres pop at speed, try 1.05.
DriveGravity=1.1
; v2.51: jumps: in the air, GTA's ground is built first where the car will land (its flight followed against GTA's map), and a car
; that drops below the ground it left while still over GTA's ground is not put back. 0 = off (v2.5).
WorldLanding=1
; v2.6: GTA's weapons and explosions on BeamNG's car while BeamNG drives: bullets dent it where they hit, pop tyres, break
; windows and lights (gone / frosted on the drawn car too), damage the engine and radiator; explosions push it and can set
; it on fire; a burning car blows up after a while (GtaBeamD1_weapons.json: burnToExplodeS); bullets through the cabin past
; your head, explosions near the car and hard crashes hurt you. The numbers per weapon group and explosion type are in
; GtaBeamD1_weapons.json (written next to this file the first time; Ctrl+F11 reads it again). 0 = off (the 2.55 way).
Weapons=1
; v2.6: how the burning car blows up: gta = GTA's explosion at it (BeamNG's car gets the push from it), beamng = BeamNG's
; own explosion too (its fireball; heavier on BeamNG).
CarExplosion=gta
; v2.7: GTA's traffic and people against BeamNG's car while BeamNG drives: a GTA car you hit (or that hits you) is pushed and
; damaged in GTA, BeamNG's car is pushed and dented; people are knocked down, riders knocked off their bikes. The numbers are in
; GtaBeamD1_traffic.json (written next to this file the first time; Ctrl+F11 reads it again). 0 = off: GTA's cars and people pass
; through BeamNG's car (the 2.63 way).
TrafficCollision=1
; v2.71: BeamNG twins for GTA's cars: this many BeamNG cars wait, parked, in BeamNG while you drive (spawned when the drive
; starts: BeamNG may hitch for a moment then). A GTA car about to meet yours gets one: the crash is BeamNG's, soft body against
; soft body; GTA's car copies its twin and gets GTA damage where the twin is dented. Which BeamNG cars: "twinPool" in
; GtaBeamD1_traffic.json. 0 = v2.7's push only (also what a GTA car gets when no twin is free). People stay GTA's.
TrafficTwins=4
